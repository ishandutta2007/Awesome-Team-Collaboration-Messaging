<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Dynamic Flow Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Background Geometric Network / Pulse Waves (Background Layer) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="140" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0 150 80" to="360 150 80" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="240" r="180" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="12 8">
      <animateTransform attributeName="transform" type="rotate" from="360 1050 240" to="0 1050 240" dur="50s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Animated Floating Data Connections / Nodes (Background Layer) -->
  <path d="M-50 220 Q 300 80, 600 220 T 1250 140" fill="none" stroke="url(#lineGrad)" stroke-width="3">
    <animate attributeName="d" 
      values="M-50 220 Q 300 80, 600 220 T 1250 140; 
              M-50 180 Q 300 260, 600 120 T 1250 200; 
              M-50 220 Q 300 80, 600 220 T 1250 140" 
      dur="12s" repeatCount="indefinite"/>
  </path>

  <path d="M-50 100 Q 400 280, 800 100 T 1250 260" fill="none" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="d" 
      values="M-50 100 Q 400 280, 800 100 T 1250 260; 
              M-50 140 Q 400 60, 800 240 T 1250 100; 
              M-50 100 Q 400 280, 800 100 T 1250 260" 
      dur="16s" repeatCount="indefinite"/>
  </path>

  <!-- Floating Animated Pulse Bubbles (Background) -->
  <circle cx="220" cy="220" r="6" fill="#38bdf8" opacity="0.8">
    <animate attributeName="cy" values="220;200;220" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="90" r="8" fill="#ec4899" opacity="0.7">
    <animate attributeName="cy" values="90;110;90" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Foreground Main Title & Subtitle Group (Ensured high contrast and foreground placement) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Category Icon / Tag -->
    <rect x="470" y="38" width="260" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="600" y="59" fill="#a5b4fc" font-size="13" font-weight="600" letter-spacing="1.5">ENTERPRISE MESSAGING</text>

    <!-- Main Title -->
    <text x="600" y="130" fill="url(#titleGrad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Team Collaboration &amp; Messaging
    </text>

    <!-- Subtitle -->
    <text x="600" y="175" fill="#e2e8f0" font-size="18" font-weight="400" opacity="0.95">
      Curated Ecosystem of Enterprise SaaS &amp; Self-Hosted Open-Source Chat Platforms
    </text>

    <!-- Feature Pill Badges -->
    <g transform="translate(340, 215)">
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <text x="70" y="22" fill="#7dd3fc" font-size="13" font-weight="600">💬 Team Chat</text>

      <rect x="155" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
      <text x="235" y="22" fill="#c7d2fe" font-size="13" font-weight="600">🔐 Matrix Protocol</text>

      <rect x="330" y="0" width="180" height="34" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1" opacity="0.9"/>
      <text x="420" y="22" fill="#f0abfc" font-size="13" font-weight="600">🚀 Self-Hosted Ops</text>
    </g>
  </g>
</svg>
